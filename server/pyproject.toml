[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel*", "srebench*"]

[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pyyaml>=6.0.3",
    "sse-starlette>=3.4.4",
    "uvicorn>=0.47.0",
    "anthropic>=0.103.1",
    "bcrypt>=4.0.0",
    "itsdangerous>=2.1.0",
    "reportlab>=4.5.1",
    "python-dotenv>=1.2.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end test that requires ANTHROPIC_API_KEY and the bundled shop-api running on :8080",
]
